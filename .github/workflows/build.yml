name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: build/reports/

  radiation-game-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [none, ae2, rs, both]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew runGameTestServer -PradiationTestMods=${{ matrix.storage }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiation-${{ matrix.storage }}-logs
          path: |
            runs/**/logs/
            run/**/logs/
            build/reports/
